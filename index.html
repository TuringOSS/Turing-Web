<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turing Club</title>
    <link rel="icon" href="/tuning.jpg" />
    <link rel="preload" href="/video1.mp4" as="video" type="video/mp4" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              turing: {
                yellow: '#FFD700',
                black: '#050505',
                dark: '#111111',
                gray: '#222222'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Oswald', 'sans-serif'],
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'marquee-reverse': 'marquee-reverse 25s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              'marquee-reverse': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0%)' },
              },
            }
          }
        }
      }
      // Force dark mode initialization
      if (!('theme' in localStorage) || localStorage.theme === 'dark') {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
    </script>
    <style>
      :root {
        --event-bg-1: #ffffff;
        --event-bg-2: #f9fafb;
        --event-bg-3: #ffffff;
        --text-primary: #000000;
        --text-secondary: #4b5563; /* gray-600 */
        --grid-color: #e5e5e5;
        --scrollbar-track: #f1f1f1;
        --scrollbar-thumb: #c1c1c1;
      }
      .dark {
        --event-bg-1: #050505;
        --event-bg-2: #111111;
        --event-bg-3: #050505;
        --text-primary: #ffffff;
        --text-secondary: #d1d5db; /* gray-300 */
        --grid-color: #222222;
        --scrollbar-track: #050505;
        --scrollbar-thumb: #333;
      }
      body {
        background-color: var(--event-bg-1);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.3s, color 0.3s;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FFD700;
      }
      
      .clip-text-image {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: url('https://picsum.photos/1920/1080?grayscale');
        background-size: cover;
        background-position: center;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
